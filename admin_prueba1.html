<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel</title>
<style>body{font-family:Arial,sans-serif;background:#111;color:#fff;max-width:600px;margin:auto;padding:20px}h1{color:#ffd21c;font-size:22px}input,button{width:100%;padding:14px;border-radius:10px;border:1px solid #555;font-size:16px;margin-top:10px}input{background:#222;color:#fff}button{background:#c90000;color:#fff;font-weight:bold;border:0;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px 6px;border-bottom:1px solid #333;text-align:center}th{color:#ffd21c;font-size:13px}td:first-child,th:first-child{text-align:left}tfoot td{font-weight:bold;color:#ffd21c}#msg{margin-top:12px;color:#ff8a8a}</style></head><body>
<h1>📊 Pedidos enviados por WhatsApp</h1>
<input id="c" type="password" placeholder="Tu código" autocomplete="off"><button onclick="ver()">Ver conteo</button><div id="msg"></div><div id="out"></div>
<script>
const SB_URL="https://khologevsgpffjvafwyz.supabase.co",SB_KEY="sb_publishable_gGjaEgVI7iwyQ03oPrunzg_tsR3HtAO";
async function ver(){
  const m=document.getElementById("msg"),o=document.getElementById("out");m.textContent="";o.innerHTML="";
  try{
    const r=await fetch(SB_URL+"/rest/v1/rpc/conteo_pedidos",{method:"POST",headers:{apikey:SB_KEY,...(SB_KEY.startsWith("eyJ")?{Authorization:"Bearer "+SB_KEY}:{}),"Content-Type":"application/json"},body:JSON.stringify({codigo:document.getElementById("c").value})});
    if(!r.ok){m.textContent="Código incorrecto o sin conexión.";return}
    const d=await r.json(),t=[0,0,0,0];
    if(!d.length){m.textContent="Aún no hay pedidos registrados.";return}
    o.innerHTML="<table><thead><tr><th>Sucursal</th><th>Hoy</th><th>7 días</th><th>Mes</th><th>Total</th></tr></thead><tbody>"+d.map(x=>{[x.hoy,x.semana,x.mes,x.total].forEach((v,i)=>t[i]+=Number(v));return `<tr><td>${x.sucursal}</td><td>${x.hoy}</td><td>${x.semana}</td><td>${x.mes}</td><td>${x.total}</td></tr>`}).join("")+`</tbody><tfoot><tr><td>Todas</td><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td></tr></tfoot></table>`;
  }catch(e){m.textContent="Sin conexión."}
}
</script></body></html>
